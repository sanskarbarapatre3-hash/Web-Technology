<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Student Task Manager</h2>
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Enter task title...">
      <button id="addBtn">Add Task</button>
      <button id="fetchBtn">Fetch Sample Tasks</button>
    </div>
    <div class="stats">
      <span>Total: <strong id="totalCount">0</strong></span>
      <span>Completed: <strong id="completedCount">0</strong></span>
      <span>Pending: <strong id="pendingCount">0</strong></span>
    </div>
    <ul id="taskList"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
