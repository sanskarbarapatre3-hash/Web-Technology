<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form with Validation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="form-container">
    <h2>Student Registration</h2>
    <form id="registrationForm" novalidate>
      
      <!-- Full Name -->
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" />
        <small class="error-msg" id="nameError"></small>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="example@domain.com" />
        <small class="error-msg" id="emailError"></small>
      </div>

      <!-- Phone Number -->
      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" placeholder="10-digit mobile number" />
        <small class="error-msg" id="phoneError"></small>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" />
        <small class="error-msg" id="passwordError"></small>
      </div>

      <button type="submit" id="submitBtn">Register Now</button>
      <div id="successMsg" class="success-banner"></div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
