<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>

<h1>STUDENT REGISTRATION</h1>

<center>
    <img src="https://d2lk14jtvqry1q.cloudfront.net/media/large_185_aac716dbd6_45d90be062.png" width="300" height="150">
    <img src="https://ycce.edu/wp-content/uploads/2024/11/LOGO_Ruby-Jubilee-Celebration.jpeg" width="150" height="150">
</center>

<br>

<form id="registrationForm">

    <b>Student Name</b><br>
    <input type="text" id="name" placeholder="Enter your name">

    <br><br>

    <b>Email</b><br>
    <input type="email" id="email" placeholder="Enter your email">

    <br><br>

    <b>Registration Number</b><br>
    <input type="text" id="reg" placeholder="Enter Registration Number">

    <br><br>

    <b>Age</b><br>
    <input type="text" id="age" placeholder="Enter your age">

    <br><br>

    <b>Gender</b><br>
    <input type="radio" id="male" name="gender" value="Male">
    Male

    <input type="radio" id="female" name="gender" value="Female">
    Female

    <input type="radio" id="other" name="gender" value="Other">
    Other

    <br><br>

    <b>Date of Birth</b><br>
    <input type="date" id="dob">

    <br><br>

    <input type="submit" value="Register">

</form>

</body>
</html>
